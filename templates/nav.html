<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nav Base{% endblock %}</title>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
</head>
<body>
    
<nav class="bg-red-800 fixed w-full z-20 top-0 start-0 border-b border-black">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
            <img src="{{ url_for('static', filename='logo/Logo_SMK.png') }}" class="h-10 w-10" alt="Logo SMK">
            <span class="self-center text-2xl font-semibold whitespace-nowrap text-white hover:text-black transition duration-200">FaSTM</span>
        </a>
        
        <!-- Authentication Buttons -->
        <div class="flex md:order-2 space-x-3 rtl:space-x-reverse">
            {% if current_user.is_authenticated %}
                <!-- Logout Button (POST request for security) -->
                <form action="{{ url_for('logout') }}" method="POST">
                    <button type="submit" class="text-white bg-black hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-800 font-medium rounded-lg text-sm px-4 py-2 text-center">
                        Logout
                    </button>
                </form>
            {% else %}
                <!-- Sign Up / Sign In Button (changes based on the current page) -->
                {% if request.path == url_for('signup') %}
                    <button type="button" class="text-white bg-black hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-800 font-medium rounded-lg text-sm px-4 py-2 text-center">
                        <a href="{{ url_for('signin') }}">Sign In</a>
                    </button>
                {% else %}
                    <button type="button" class="text-white bg-black hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-800 font-medium rounded-lg text-sm px-4 py-2 text-center">
                        <a href="{{ url_for('signup') }}">Sign Up</a>
                    </button>
                {% endif %}
            {% endif %}
        </div>

        <!-- Navigation Links (Only show if authenticated) -->
        <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
            {% if current_user.is_authenticated %}
            <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-700 rounded-lg bg-red-800 md:space-x-8 rtl:space-x-reverse
             md:flex-row md:mt-0 md:border-0 md:bg-red-800">
                <li>
                    <a href="{{ url_for('home') }}" class="block py-2 px-3 text-white hover:text-black transition duration-200">Home</a>
                </li>
                <li>
                    <a href="{{ url_for('presensi') }}" class="block py-2 px-3 text-white hover:text-black transition duration-200">Presensi</a>
                </li>
            </ul>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% block body1 %}
    {% endblock %}
</main>

</body>
</html>
